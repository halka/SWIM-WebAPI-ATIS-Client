openapi: 3.0.3
info:
  title: SWIM ATIS Information Request API
  version: 1.0.1
  description: |
    Client-facing OpenAPI definition based on MLIT Civil Aviation Bureau
    "SWIM Service API Integration Specification, Appendix 07 - ATIS Information
    Request Service", version 1.0.1, issued 2025-05-30.

    Authentication is included because it is required by this client library, but
    the Appendix 07 document itself specifies FLV402001 only.
servers:
  - url: https://web.swim.mlit.go.jp
    description: SWIM service provider system
tags:
  - name: Authentication
  - name: ATIS
paths:
  /swim/webapi/login:
    post:
      tags: [Authentication]
      summary: Authenticate with SWIM
      servers:
        - url: https://top.swim.mlit.go.jp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwimCredentials'
      responses:
        '200':
          description: Authentication response. The client expects MSMSI and MSMAI cookies.
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          description: Authentication failed.
  /f2atrq/web/FLV402001:
    get:
      tags: [ATIS]
      summary: Request ATIS information
      description: |
        Returns ATIS information matching the requested ICAO airport locations.
        The specification represents both success and business errors with HTTP 200.
      operationId: getAtis
      security:
        - MSMSI: []
          MSMAI: []
      parameters:
        - name: location
          in: query
          required: true
          description: One ICAO airport code, or multiple codes separated by commas.
          schema:
            type: string
            minLength: 1
          examples:
            single:
              value: RJTT
            multiple:
              value: RJCC,RJCH
        - name: dispcnt
          in: query
          required: true
          description: Number of ATIS entries returned for each airport.
          schema:
            type: integer
            minimum: 1
            maximum: 50
          example: 3
      responses:
        '200':
          description: Normal result, no-data result, or documented business error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AtisSuccessResponse'
                  - $ref: '#/components/schemas/AtisErrorResponse'
              examples:
                success:
                  value:
                    error_info:
                      - error_code: '0'
                        error_description: ''
                    data:
                      - location: RJTT
                        atisinfo:
                          - "ATIS RJTT R\nM0230\n..."
                noData:
                  value:
                    error_info:
                      - error_code: '1'
                        error_description: ''
                    data: []
                invalidLocation:
                  value:
                    error_info:
                      - error_code: '4'
                        error_description: RJ88
        default:
          description: Undocumented HTTP-level failure.
components:
  securitySchemes:
    MSMSI:
      type: apiKey
      in: cookie
      name: MSMSI
    MSMAI:
      type: apiKey
      in: cookie
      name: MSMAI
  schemas:
    SwimCredentials:
      type: object
      required: [id, password]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1
    AtisErrorInfo:
      type: object
      required: [error_code, error_description]
      additionalProperties: false
      properties:
        error_code:
          type: string
          enum: ['0', '1', '2', '3', '4', '5', '6', '99']
          description: |
            0 normal; 1 no matching data; 2 location missing; 3 dispcnt missing;
            4 nonexistent location; 5 too many locations; 6 dispcnt outside 1-50;
            99 unexpected/system error.
        error_description:
          type: string
          description: Offending value for codes 4 and 6; otherwise normally empty.
    AtisLocationData:
      type: object
      required: [location, atisinfo]
      additionalProperties: false
      properties:
        location:
          type: string
          description: ICAO airport code.
        atisinfo:
          type: array
          items:
            type: string
          description: ATIS information entries.
    AtisSuccessResponse:
      type: object
      required: [error_info, data]
      additionalProperties: false
      properties:
        error_info:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AtisErrorInfo'
        data:
          type: array
          items:
            $ref: '#/components/schemas/AtisLocationData'
    AtisErrorResponse:
      type: object
      required: [error_info]
      additionalProperties: false
      properties:
        error_info:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AtisErrorInfo'
